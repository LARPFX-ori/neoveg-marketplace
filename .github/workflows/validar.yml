name: Validar catálogo

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # confere licenças, tamanhos, ausência de executáveis e se o index.json está em dia
      - run: python -I ferramentas/loja.py validar
